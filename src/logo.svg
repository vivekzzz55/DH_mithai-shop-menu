<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF232C"/>
      <stop offset="100%" stop-color="#C81018"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Glow / Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Red Oval Badge -->
    <ellipse cx="300" cy="180" rx="275" ry="115" fill="url(#redGrad)"/>
    <ellipse cx="300" cy="180" rx="273" ry="113" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Stylized "Dayal House" Text -->
    <g transform="translate(300, 205)" text-anchor="middle">
      <text font-family="'Manrope', 'Montserrat', 'Trebuchet MS', sans-serif" font-size="78" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="1">
        Dayal House
      </text>
    </g>

    <!-- Top Hanging Tag Emblem Box -->
    <g transform="translate(235, 12)">
      <!-- Hanging String -->
      <path d="M 65 0 L 12 32 L 118 32 Z" fill="none" stroke="#171717" stroke-width="3" stroke-linejoin="round"/>
      
      <!-- Tag Box Base -->
      <rect x="10" y="28" width="110" height="92" rx="10" fill="#FFFFFF" stroke="#171717" stroke-width="3"/>
      
      <!-- "D" in Crimson Red -->
      <text x="22" y="100" font-family="'Outfit', 'Impact', sans-serif" font-size="76" font-weight="900" fill="#E31825">D</text>
      
      <!-- "H" in Deep Royal Navy -->
      <text x="64" y="100" font-family="'Outfit', 'Impact', sans-serif" font-size="76" font-weight="900" fill="#1B267B">H</text>
    </g>
    
    <!-- Registered Trademark ® -->
    <g transform="translate(545, 128)">
      <circle cx="12" cy="12" r="14" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
      <text x="12" y="18" font-family="sans-serif" font-size="16" font-weight="bold" fill="#171717" text-anchor="middle">R</text>
    </g>
  </g>
</svg>
